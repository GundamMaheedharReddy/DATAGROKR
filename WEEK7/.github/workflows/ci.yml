name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rejects PRs that break the Gitflow rules (only runs on pull requests)
  gitflow-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Gitflow branch rules
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD_REF -> $BASE_REF"
          fail() { echo "::error::$*"; exit 1; }

          [[ "$HEAD_REF" =~ ^(feature|bugfix|release|hotfix)/[a-z0-9._-]+$ ]] \
            || fail "Branch '$HEAD_REF' must look like feature/<name>, bugfix/<name>, release/<x.y.z> or hotfix/<x.y.z>"

          case "$BASE_REF" in
            main)
              [[ "$HEAD_REF" =~ ^(release|hotfix)/ ]] \
                || fail "Only release/* and hotfix/* branches may target main (got '$HEAD_REF')" ;;
            release/*)
              [[ "$HEAD_REF" =~ ^bugfix/ ]] \
                || fail "Only bugfix/* branches may target a release branch (got '$HEAD_REF')" ;;
            develop) ;;  # feature/*, bugfix/*, release/* and hotfix/* back-merges are all fine
          esac
          echo "Gitflow rules OK"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m flake8 app tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
